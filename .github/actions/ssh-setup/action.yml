name: ssh-setup
description: Configure pinned-host-key SSH access to the sensor
inputs:
  key:
    required: true
  known_hosts:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        KEY: ${{ inputs.key }}
        KNOWN: ${{ inputs.known_hosts }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
        printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/id_ed25519
